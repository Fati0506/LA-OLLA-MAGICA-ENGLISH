<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administrativo - La Olla Mágica</title>
  <link rel="stylesheet" href="css/diseñonav.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    .admin-container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    /* Ahora usamos 3 columnas para incluir los Ingresos */
    .admin-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
    .dashboard-card { background: var(--bg-tarjetas); padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); margin-bottom: 30px; }
    .dashboard-card h3 { color: var(--texto-mutado); font-size: 14px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .metric-value { font-size: 28px; font-weight: 700; color: #4d4b7d; }
    body.dark-mode .metric-value { color: #bc90ff; }
    
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    .admin-table th, .admin-table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border-input); }
    .admin-table th { background-color: #f4f2db; color: #4d4b7d; font-weight: 700; }
    body.dark-mode .admin-table th { background-color: #25213b; color: #fff; }
    
    /* Select interactivo para cambiar estados */
    .status-select { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border-input); font-family: 'Montserrat'; font-weight: 600; cursor: pointer; outline: none; background: var(--bg-principal); color: var(--texto-principal); }
    .status-select:focus { border-color: #6c5ce7; }
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">🍲 Panel Control Olla Mágica</a>
      <div class="nav-right">
        <button class="theme-btn" id="themeBtn">🌙</button>
        <button class="logout-btn" id="btnAdminLogout" style="display:inline-block;">🚪 Salir</button>
      </div>
    </nav>
  </header>

  <main class="admin-container">
    <h2 style="margin-bottom: 20px;">Resumen del Negocio</h2>
    
    <div class="admin-summary">
      <div class="dashboard-card">
        <h3>💰 Ingresos Totales</h3>
        <div class="metric-value" id="totalIngresos">S/ 0.00</div>
      </div>
      <div class="dashboard-card">
        <h3>🛒 Pedidos Activos</h3>
        <div class="metric-value" id="totalPedidos">0</div>
      </div>
      <div class="dashboard-card">
        <h3>👥 Clientes</h3>
        <div class="metric-value" id="totalUsuarios">0</div>
      </div>
    </div>

    <div class="dashboard-card">
      <h3 style="color: var(--texto-principal); font-size: 18px; margin-bottom: 15px;">Gestión de Pedidos</h3>
      <table class="admin-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Detalle</th>
            <th>Total</th>
            <th>Estado (Actualizable)</th>
          </tr>
        </thead>
        <tbody id="tablaPedidosBody">
          <tr><td colspan="5" style="text-align:center;">Cargando pedidos...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="dashboard-card">
      <h3 style="color: var(--texto-principal); font-size: 18px; margin-bottom: 15px;">Reservas de Mesas</h3>
      <table class="admin-table">
        <thead>
          <tr>
            <th>Cliente (Correo)</th>
            <th>Mesa Asignada</th>
            <th>Fecha de Solicitud</th>
          </tr>
        </thead>
        <tbody id="tablaReservasBody">
          <tr><td colspan="3" style="text-align:center;">Cargando reservas...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
